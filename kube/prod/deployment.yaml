apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-frontend-gpt-core
  namespace: core-frontend
  labels:
    app: core-frontend-gpt-core
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: core-frontend-gpt-core
  template:
    metadata:
      labels:
        app: core-frontend-gpt-core
    spec:
      nodeSelector:
        agentpool: userpool
      terminationGracePeriodSeconds: 30
      containers:
        - name: core-frontend-gpt-core
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: core-frontend-gpt-core-secrets
          ports:
            - name: http
              containerPort: 5005
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
