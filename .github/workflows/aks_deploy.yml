name: AKS prod

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:

env:
  ACR_NAME: corecontainers
  IMAGE_NAME: core-frontend-gpt-core
  RESOURCE_GROUP: core-frontend
  AKS_CLUSTER_NAME: core-frontend-kubernetes-cluster
  NAMESPACE: core-frontend
  DEPLOYMENT_NAME: core-frontend-gpt-core

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: azure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image reference
        id: image
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "ref=${{ env.ACR_NAME }}.azurecr.io/aks-${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Docker ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build and push
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ steps.image.outputs.ref }} .

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --admin \
            --overwrite-existing

      - name: Sync secrets to AKS
        env:
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl create secret generic core-frontend-gpt-core-secrets \
            --namespace core-frontend \
            --from-literal=CORE_API_KEY="${{ env.CORE_API_KEY }}" \
            --from-literal=OPENAI_API_KEY="${{ env.OPENAI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Service and HTTPRoute
        run: |
          kubectl apply -f kube/prod/service.yaml
          kubectl apply -f kube/prod/httproute.yaml

      - name: Deploy to AKS
        run: |
          export IMAGE="${{ steps.image.outputs.ref }}"
          envsubst < kube/prod/deployment.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=300s
